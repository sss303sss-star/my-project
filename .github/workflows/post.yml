name: instagram-post

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:
    inputs:
      republish:
        description: "queue에서 새 글을 꺼내지 않고 가장 최근 posts/ 글을 다시 게시"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y fonts-nanum && npm ci

      - run: node post.mjs prepare
        if: ${{ !inputs.republish }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 이미지를 repo에 push해 raw URL로 공개 (public repo 필요)
      - if: ${{ !inputs.republish }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add posts queue.json && git commit -m "post: $(date +%F)" && git push

      - run: node post.mjs publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
