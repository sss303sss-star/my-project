name: instagram-post

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y fonts-nanum && npm ci

      - run: node post.mjs generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_THEME: ${{ vars.ACCOUNT_THEME }}

      # 이미지를 repo에 push해 raw URL로 공개 (public repo 필요)
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add posts && git commit -m "post: $(date +%F)" && git push

      - run: node post.mjs publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
