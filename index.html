<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피드 관리</title>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; color: #262626; }
    main { max-width: 470px; margin: 0 auto; padding: 16px 16px 96px; }
    h2 { font-size: 16px; margin: 32px 0 12px; display: flex; justify-content: space-between; align-items: center; }
    article { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
    header { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
    .badge { font-weight: 400; color: #737373; white-space: nowrap; }
    img, .card { display: block; width: 100%; aspect-ratio: 1; }
    /* post.mjs의 SVG 카드(1080px 기준 72px 글자, 96px 줄간격)를 비율로 재현 */
    .card { container-type: inline-size; background: #1f2937; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-weight: 700; font-size: 6.67cqw; line-height: 8.89cqw; }
    .card span { min-height: 8.89cqw; } /* 본문 장의 빈 줄 = 간격 */
    .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
    .slides > * { flex: 0 0 100%; scroll-snap-align: start; }
    /* post.mjs 본문 장: 소제목 80px/128px, 본문 48px/72px */
    .card.body span { font-size: 4.44cqw; line-height: 6.67cqw; min-height: 6.67cqw; }
    .card.body span:first-child { font-size: 7.41cqw; line-height: 11.85cqw; }
    .card.drop { outline: 4px dashed #0095f6; outline-offset: -8px; }
    p { margin: 0; padding: 12px; font-size: 14px; white-space: pre-line; }
    .tools { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
    button { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid #dbdbdb; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #0095f6; border-color: #0095f6; color: #fff; font-weight: 600; }
    button.danger { color: #ed4956; }
    button:disabled { opacity: .4; cursor: default; }
    form { display: grid; gap: 10px; padding: 12px; border-top: 1px solid #efefef; background: #fcfcfc; }
    label { display: grid; gap: 4px; font-size: 12px; color: #737373; }
    input, textarea { font: inherit; font-size: 14px; padding: 8px; border: 1px solid #dbdbdb; border-radius: 6px; color: #262626; }
    textarea { resize: vertical; }
    .row { display: flex; gap: 6px; align-items: start; }
    .row textarea { flex: 1; }
    nav { position: sticky; top: 0; z-index: 1; display: flex; background: #fafafa; border-bottom: 1px solid #dbdbdb; margin: 0 -16px; }
    nav button { flex: 1; border: 0; border-radius: 0; background: none; padding: 14px; font-size: 14px; font-weight: 600; color: #737373; }
    nav button.on { color: #262626; box-shadow: inset 0 -2px #262626; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #dbdbdb; padding: 12px 16px; }
    .bar div { max-width: 470px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  </style>
</head>
<body>
<main id="app">
  <nav>
    <button :class="{ on: tab === 'queue' }" @click="tab = 'queue'">올릴 글 {{ queue.length }}</button>
    <button :class="{ on: tab === 'posted' }" @click="tab = 'posted'">올린 글 {{ posted.length }}</button>
  </nav>

  <template v-if="tab === 'queue'">
  <h2>매주 화요일 11:50 자동 게시 <button @click="add">＋ 새 글</button></h2>
  <article v-for="(post, i) in queue" :key="post">
    <header>{{ post.topic || '(제목 없음)' }}<span class="badge">{{ scheduled(i) }} 예정</span></header>
    <div class="slides">
      <div v-for="(text, s) in [post.image_text, ...(post.slides ?? [])]" class="card" :class="{ body: s > 0, drop: dropping === post }"
           :style="post.image && { background: `linear-gradient(#00000073, #00000073), url(${post.image}) center/cover` }"
           @dragover.prevent="dropping = post" @dragleave="dropping = null" @drop.prevent="upload(post, $event.dataTransfer.files[0], i)">
        <span v-for="line in s ? bodyLines(text) : lines(text)">{{ line }}</span>
      </div>
    </div>
    <p>{{ post.caption }}</p>
    <div class="tools">
      <button @click="editing = editing === post ? null : post">{{ editing === post ? '닫기' : '수정' }}</button>
      <button :disabled="i === 0" @click="move(i, -1)">▲ 앞으로</button>
      <button :disabled="i === queue.length - 1" @click="move(i, 1)">▼ 뒤로</button>
      <button class="danger" @click="remove(i)">삭제</button>
    </div>
    <form v-if="editing === post" @submit.prevent>
      <label>제목 (관리용)<input v-model="post.topic" @input="dirty = true"></label>
      <label>표지 문구 (줄바꿈 가능, 12자마다 자동 줄바꿈)<textarea v-model="post.image_text" rows="3" @input="dirty = true"></textarea></label>
      <label>넘겨 보는 장 (첫 줄 = 소제목)
        <div v-for="(slide, s) in post.slides ?? []" class="row">
          <textarea v-model="post.slides[s]" rows="5" @input="dirty = true"></textarea>
          <button type="button" class="danger" @click="post.slides.splice(s, 1); post.slides.length || delete post.slides; dirty = true">✕</button>
        </div>
        <button type="button" @click="(post.slides ??= []).push('소제목\n내용'); dirty = true">＋ 장 추가</button>
      </label>
      <label>배경 이미지 (카드에 끌어다 놓거나 선택)
        <div class="row">
          <input type="file" accept="image/png,image/jpeg,image/webp" @change="upload(post, $event.target.files[0], i)">
          <button v-if="post.image" type="button" class="danger" @click="delete post.image; dirty = true">빼기</button>
        </div>
      </label>
      <label>캡션<textarea v-model="post.caption" rows="12" @input="dirty = true"></textarea></label>
    </form>
  </article>
  </template>

  <template v-else>
  <h2>Instagram에 올라간 글 (수정 불가)</h2>
  <article v-for="post in posted" :key="post.date">
    <header>{{ post.topic }}<span class="badge">{{ post.date }} 게시</span></header>
    <div class="slides">
      <img v-for="n in (post.slides?.length ?? 0) + 1" :src="`posts/${post.date}${post.slides ? `-${n}` : ''}.jpg`" :alt="post.image_text">
    </div>
    <p>{{ post.caption }}</p>
  </article>
  </template>

  <div class="bar"><div>
    <span>{{ status }}</span>
    <button class="primary" :disabled="!dirty" @click="save">저장</button>
  </div></div>
</main>
<script>
  const REPO = "sss303sss-star/my-project";

  Vue.createApp({
    data: () => ({ tab: "queue", queue: [], posted: [], editing: null, dropping: null, dirty: false, status: "" }),
    async mounted() {
      this.queue = await (await fetch("queue.json", { cache: "no-store" })).json();
      addEventListener("beforeunload", (e) => this.dirty && e.preventDefault());
      // ponytail: posts/ 목록은 GitHub API로 조회 (비로그인 시간당 60회 제한) -> 실제 게시된 글만 보임
      const files = await (await fetch(`https://api.github.com/repos/${REPO}/contents/posts`)).json();
      const dates = files.filter((f) => f.name.endsWith(".json")).map((f) => f.name.slice(0, -5)).sort().reverse();
      this.posted = await Promise.all(dates.map(async (date) => ({ date, ...(await (await fetch(`posts/${date}.json`)).json()) })));
    },
    watch: { dirty(v) { if (v) this.status = "저장 안 한 변경이 있어요"; } },
    methods: {
      lines: (text) => text.match(/.{1,12}/gu) ?? [], // post.mjs와 같은 줄바꿈 규칙
      bodyLines: (text) => text.split("\n").flatMap((l, i) => (i ? l.match(/.{1,18}/gu) ?? [""] : [l])),
      scheduled(i) { // 매주 화요일 11:50 KST 기준 i번째 게시일 (post.yml cron과 맞출 것)
        const kst = new Date(Date.now() + 9 * 3600e3);
        let days = (9 - kst.getUTCDay()) % 7;
        if (days === 0 && kst.getUTCHours() * 60 + kst.getUTCMinutes() >= 11 * 60 + 50) days = 7;
        kst.setUTCDate(kst.getUTCDate() + days + i * 7);
        return kst.toISOString().slice(0, 10);
      },
      add() {
        const post = { topic: "[분류] 새 글", image_text: "[분류]\n표지 문구", caption: "" };
        this.queue.push(post);
        this.editing = post;
        this.dirty = true;
      },
      move(i, d) {
        this.queue.splice(i + d, 0, ...this.queue.splice(i, 1));
        this.dirty = true;
      },
      remove(i) {
        if (!confirm(`"${this.queue[i].topic}" 글을 삭제할까요?`)) return;
        this.queue.splice(i, 1);
        this.dirty = true;
      },
      async upload(post, file, i) {
        this.dropping = null;
        if (!file) return;
        const path = `images/${this.scheduled(i)}-${Date.now()}.${file.type.split("/")[1].replace("jpeg", "jpg")}`;
        const res = await fetch(path, { method: "PUT", body: file });
        if (!res.ok) return alert(`이미지 업로드 실패: ${await res.text()}`);
        post.image = path;
        this.dirty = true;
      },
      async save() {
        const res = await fetch("queue.json", { method: "PUT", body: JSON.stringify(this.queue) });
        if (!res.ok) return alert(`저장 실패: ${await res.text()}`);
        this.dirty = false;
        this.status = "저장했어요. 실제 게시에 반영하려면 Claude에게 '반영해줘'라고 말해 주세요.";
      },
    },
  }).mount("#app");
</script>
</body>
</html>
